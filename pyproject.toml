[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-bridge"
version = "2.1.0"
description = "A host-neutral Jev bridge: Agent Skill, MCP, CLI, and Python API"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
dependencies = ["typesafe-sdk>=0.6.0,<0.7.0", "httpx2>=2.0.0,<3"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
keyring = ["keyring>=25,<26"]

[project.scripts]
jev-bridge = "jev_bridge:main"

[tool.setuptools]
package-dir = {"" = "jev/scripts"}
py-modules = ["jev", "jev_bridge", "jev_mcp"]
packages = ["_vendor"]
