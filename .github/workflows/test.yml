name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and protocol extras
        run: python -m pip install ".[mcp,keyring]"
      - name: Check installed entry point
        run: jev-bridge --version
      - name: Compile modules
        run: python -I -m compileall -q install_skill.py jev/scripts tests
      - name: Run offline and SDK protocol tests
        env:
          JEV_REQUIRE_MCP_TESTS: '1'
        run: python -I -m unittest discover -s tests -v
